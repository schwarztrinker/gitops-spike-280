apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sdl-test
namePrefix: test-
resources:
  - ../../base
patches:
  - target: {kind: Pipeline, name: sales-load}
    patch: |-
      - op: replace
        path: /spec/schedule/cron
        value: "0 2 * * *"
      - op: add
        path: /spec/runAs
        value: pipeline-sales-test
  - target: {kind: Pipeline, name: sales-report}
    patch: |-
      - op: replace
        path: /spec/schedule/cron
        value: "0 4 * * *"
      - op: add
        path: /spec/runAs
        value: pipeline-sales-test
