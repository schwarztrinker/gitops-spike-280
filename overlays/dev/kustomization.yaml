apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sdl-dev
namePrefix: dev-alice-
resources:
  - ../../base
patches:
  - target: {kind: Pipeline, name: sales-load}
    patch: |-
      - op: remove
        path: /spec/schedule
  - target: {kind: Pipeline, name: sales-report}
    patch: |-
      - op: remove
        path: /spec/schedule
  - target: {kind: Connection, name: crm-db}
    patch: |-
      - op: replace
        path: /spec/config/database
        value: crm_dev
