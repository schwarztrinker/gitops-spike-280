apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: dev, namespace: gitops-spike}
spec:
  interval: 1m
  sourceRef: {kind: GitRepository, name: spike, namespace: gitops-spike}
  path: ./overlays/dev
  prune: true
  targetNamespace: gitops-spike
  postBuild:
    substitute:
      catalog: sales_dev
