apiVersion: stardelt.io/v1alpha1
kind: Pipeline
metadata:
  name: sales-load
spec:
  schedule:
    cron: "0 2 * * *"
  tasks:
    - name: load
      kind: sql
      warehouse: sales
      sql: INSERT INTO ${catalog}.sales SELECT * FROM staging.sales
    - name: quality
      kind: sql
      warehouse: sales
      sql: SELECT count(*) AS rows FROM ${catalog}.sales
      dependsOn: [load]
---
apiVersion: stardelt.io/v1alpha1
kind: Pipeline
metadata:
  name: sales-report
spec:
  schedule:
    cron: "0 4 * * *"
  tasks:
    - name: report
      kind: sql
      warehouse: sales
      sql: SELECT * FROM ${catalog}.sales
